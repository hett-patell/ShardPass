# The gates, run by something other than a person remembering to. `pnpm verify` is the same
# command used locally: typecheck, lint, format, the security build and its scanner, every
# unit test, and the dependency rules. The browser job runs the Playwright specs, which
# `pnpm test` deliberately leaves out because they need a real build and a browser.
name: Verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          # The engines field pins this range; the release gate refuses anything else.
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` is not environment-free, and pretending otherwise makes the gate a
      # liar: `tests/browser/startup-process-harness.test.ts` spawns a real Chromium, and
      # `tests/tooling/project1-network-runner.test.ts` asks for actual network isolation
      # rather than a stub. Both are given what they need instead of being skipped.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install the sandbox the network-isolation test measures
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Let an unprivileged sandbox configure its own network namespace
        # Ubuntu 24.04 restricts what an unprivileged user namespace may do, and bubblewrap
        # cannot so much as bring up loopback inside one: "bwrap: loopback: Failed RTM_NEWADDR:
        # Operation not permitted". The machine this project is developed on has this switch
        # at 0, which is why the isolation test passes there. It is a property of the runner,
        # not of the code under test.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prove the sandbox actually isolates on this runner
        # Some images restrict unprivileged user namespaces, which would leave the isolation
        # test failing several minutes later with nothing naming the cause. One line here says
        # it plainly, and a network that is reachable inside the sandbox fails the job.
        run: |
          bwrap --unshare-net --dev-bind / / -- node -e "
            require('dns').promises.lookup('example.com').then(
              () => { console.error('the sandbox did not block the network'); process.exit(1); },
              () => console.log('network isolation enforced'),
            );
          "
      - run: pnpm verify

  browser:
    name: Browser specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Keep the report when a spec fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  package:
    name: Store package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Proves the upload can still be built, and prints the hash that identifies it.
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: shardpass-extension
          path: release/*.zip
          retention-days: 14
