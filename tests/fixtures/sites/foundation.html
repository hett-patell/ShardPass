<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShardPass browser fixture</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px;
        color: #19191c;
        background: #f3f3f1;
      }
      main {
        max-width: 560px;
        padding: 32px;
        background: white;
        border: 1px solid #c7c7c2;
      }
      label {
        display: grid;
        gap: 8px;
        margin-top: 20px;
      }
      input {
        min-height: 40px;
        padding: 8px 12px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Foundation test site</h1>
      <p>
        This local page contains non-secret fields for extension smoke and picker isolation tests.
      </p>
      <label
        >Email <input id="foundation-email" name="email" type="email" autocomplete="username"
      /></label>
      <label
        >Password <input name="password" type="password" autocomplete="current-password"
      /></label>
    </main>
    <script type="module" src="./picker-harness.ts"></script>
  </body>
</html>
